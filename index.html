<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept by Lily</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#F8E7EC;
}

header{
    background:#E6C4CC;
    text-align:center;
    padding:30px;
    color:#444;
}

.products{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:30px;
    padding:40px;
}

.card{
    width:320px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    text-align:center;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
}

.card h3{
    margin:20px 0 10px;
    color:#444;
}

.price{
    font-size:28px;
    margin-bottom:20px;
    color:#444;
}

.btn{
    display:inline-block;
    margin-bottom:25px;
    padding:12px 24px;
    border-radius:10px;
    background:#D6A5A4;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.btn:hover{
    opacity:.9;
}

</style>

</head>

<body>

<header>
    <h1>PRUEBA VERSION 2 💖</h1>
    <p>Skincare, maquillaje y accesorios</p>
</header>

<section class="products">

    <div class="card">

        <img src="left-on-red.jpeg" alt="Left on Red">

        <h3>E.L.F. Left on Red</h3>

        <div class="price">$13</div>

        <a class="btn"
           href="https://wa.me/50587984118?text=Hola,%20me%20interesa%20la%20E.L.F.%20Left%20on%20Red."
           target="_blank">
           Comprar
        </a>

    </div>

    <div class="card">

        <img src="pink-positive.jpeg" alt="Pink Positive">

        <h3>E.L.F. Pink Positive</h3>

        <div class="price">$13</div>

        <a class="btn"
           href="https://wa.me/50587984118?text=Hola,%20me%20interesa%20la%20E.L.F.%20Pink%20Positive."
           target="_blank">
           Comprar
        </a>

    </div>

</section>

</body>
</html>
