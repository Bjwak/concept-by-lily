<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Concept by Lily</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#F8E7EC;
}

header{
    background:#E6C4CC;
    color:#444;
    text-align:center;
    padding:40px 20px;
}

header h1{
    margin:0;
    font-size:3rem;
}

header p{
    margin-top:15px;
    font-size:1.2rem;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:40px;
    padding:50px 20px;
}

.card{
    background:white;
    width:320px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:transform .2s ease;
}

.card:hover{
    transform:translateY(-5px);
}

.image-container{
    height:280px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.image-container img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card h3{
    margin:0;
    color:#444;
    font-size:2rem;
}

.price{
    margin:20px 0;
    font-size:2.2rem;
    color:#444;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:#D6A5A4;
    color:white;
    padding:14px 30px;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    opacity:.9;
}

@media(max-width:768px){

    header h1{
        font-size:2.2rem;
    }

    .card{
        width:100%;
        max-width:360px;
    }

}

</style>

</head>

<body>

<header>

    <h1>Concept by Lily 💖</h1>

    <p>
        Skincare, maquillaje y accesorios
    </p>

</header>

<section class="products">

    <div class="card">

        <div class="image-container">
            <img src="left-on-red.jpeg" alt="ELF Left on Red">
        </div>

        <div class="card-content">

            <h3>E.L.F. Left on Red</h3>

            <div class="price">
                $13
            </div>

            <a
            class="btn"
            href="https://wa.me/50587984118?text=Hola,%20me%20interesa%20el%20producto%20E.L.F.%20Left%20on%20Red."
            target="_blank">
            Comprar
            </a>

        </div>

    </div>

    <div class="card">

        <div class="image-container">
            <img src="pink-positive.jpeg" alt="ELF Pink Positive">
        </div>

        <div class="card-content">

            <h3>E.L.F. Pink Positive</h3>

            <div class="price">
                $13
            </div>

            <a
            class="btn"
            href="https://wa.me/50587984118?text=Hola,%20me%20interesa%20el%20producto%20E.L.F.%20Pink%20Positive."
            target="_blank">
            Comprar
            </a>

        </div>

    </div>

</section>

</body>
</html>
